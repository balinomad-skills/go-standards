name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build ZIP and single-page artifacts
        id: build_assets
        run: |
          release_asset_dir="${RUNNER_TEMP}/release-assets"
          echo "release_asset_dir=${release_asset_dir}" >> "$GITHUB_OUTPUT"
          bash scripts/package.sh --output-dir "${release_asset_dir}"
          bash scripts/single-page.sh --output-dir "${release_asset_dir}"

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          working_directory: ${{ steps.build_assets.outputs.release_asset_dir }}
          files: |
            *.zip
            *.txt
          fail_on_unmatched_files: true
